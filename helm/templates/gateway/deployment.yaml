apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "notapizza/idvom:gateway" 
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: LISTEN_ADDR
            - name: CATALOG_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: CATALOG_BASE_URL
            - name: ORDERS_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: gateway-config
                  key: ORDERS_BASE_URL
            - name: BASIC_USERS
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: BASIC_USERS
